version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: ims_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: IMS
    volumes:
      - mongo_data:/data/db
    networks:
      - ims_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ims_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongodb:27017/IMS
      CORS_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ims_network

  frontend:
    build:
      context: ./Frontend/inventory_management_system
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:3001
    container_name: ims_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ims_network

volumes:
  mongo_data:

networks:
  ims_network:
    driver: bridge

